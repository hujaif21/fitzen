name: fitzen
description: "FitZen fitness application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  pedometer: ^4.2.0
  permission_handler: ^11.3.0
  heart_bpm: ^2.0.0

  # Core Packages
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2

  # Video Playback Package
  video_player: ^2.8.6

  # Network & API
  http: ^1.2.0
  dio: ^5.4.3
  retrofit: ^4.1.0

  # JSON Serialization
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code Generators
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/